<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script>
    /* Opened at the portals' own address? Move to the same page on the main
       site's /account/ address, so this login is shared with the main site's
       header (browsers keep logins separate per address). Served through
       /account/ the hostname is the main site's, so this never loops. */
    if (location.hostname === 'clickcab-portals.vercel.app') {
      location.replace('https://clickcab-7fv3.vercel.app/account' + location.pathname + location.search + location.hash);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account – Click Cabs</title>
  <link rel="icon" type="image/png" href="https://clickcabs.in/images/favicon.png" />
  <meta name="description" content="Create a Click Cabs customer account to book cabs and track your rides." />
  <meta name="theme-color" content="#01456c" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --blue:#01456c; --yellow:#f5a800; --border:#dde3ea; --text:#1a2b3c; --muted:#6b7c8d; }
    body { font-family:'Segoe UI',sans-serif; background:#f4f7fa; min-height:100vh; display:flex; flex-direction:column; }
    nav { background:var(--blue); padding:0 40px; display:flex; align-items:center; justify-content:space-between; height:65px; box-shadow:0 2px 8px rgba(0,0,0,0.18); }
    .nav-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .nav-logo img { height:42px; width:42px; object-fit:contain; border-radius:6px; background:#fff; padding:3px; }
    .nav-logo-text { color:#fff; font-size:1.4rem; font-weight:800; }
    .nav-logo-text span { color:var(--yellow); }
    .nav-link { color:rgba(255,255,255,0.8); font-size:0.88rem; text-decoration:none; }
    .nav-link:hover { color:#fff; }

    .main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
    .card { background:#fff; border-radius:16px; box-shadow:0 6px 32px rgba(1,69,108,0.12); width:100%; max-width:480px; overflow:hidden; }
    .card-header { background:linear-gradient(135deg,var(--blue),#025a8e); padding:32px; text-align:center; }
    .card-header img { width:60px; height:60px; border-radius:50%; background:#fff; padding:6px; object-fit:contain; margin-bottom:14px; box-shadow:0 4px 16px rgba(0,0,0,0.15); }
    .card-header h1 { color:#fff; font-size:1.4rem; font-weight:800; margin-bottom:4px; }
    .card-header p { color:rgba(255,255,255,0.72); font-size:0.83rem; }
    .card-body { padding:28px 32px 32px; }

    .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    label { font-size:0.78rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
    .req { color:#e03d3d; }
    .input-wrap { position:relative; }
    .input-wrap i.ico { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:0.85rem; pointer-events:none; }
    input { width:100%; border:1.5px solid var(--border); border-radius:8px; padding:11px 14px 11px 38px; font-size:0.92rem; color:var(--text); outline:none; font-family:inherit; transition:border-color 0.2s,box-shadow 0.2s; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(1,69,108,0.10); }

    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

    .error-msg { display:none; background:#fff0f0; border:1px solid #f5c6c6; border-radius:8px; padding:10px 14px; font-size:0.83rem; color:#c0392b; margin-bottom:14px; align-items:center; gap:8px; }
    .success-msg { display:none; background:#e8f7ef; border:1px solid #a8dfc0; border-radius:8px; padding:10px 14px; font-size:0.83rem; color:#1a7f4b; margin-bottom:14px; align-items:center; gap:8px; }

    .signup-btn { width:100%; background:var(--yellow); color:var(--blue); font-weight:800; font-size:1rem; padding:13px; border:none; border-radius:8px; cursor:pointer; font-family:inherit; transition:background 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
    .signup-btn:hover { background:#e09900; }
    .signup-btn:disabled { opacity:0.6; cursor:not-allowed; }

    .terms { font-size:0.78rem; color:var(--muted); text-align:center; margin-bottom:16px; }
    .terms a { color:var(--blue); }
    .login-prompt { text-align:center; margin-top:18px; font-size:0.85rem; color:var(--muted); }
    .login-prompt a { color:var(--blue); font-weight:700; text-decoration:none; }
    .login-prompt a:hover { text-decoration:underline; }

    .divider { display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--muted); font-size:0.75rem; }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }

    @media(max-width:480px) { .card-body { padding:22px 18px 26px; } .form-row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">
    <img src="https://clickcabs.in/images/logo.jpg" alt="Click Cabs"/>
    <span class="nav-logo-text">Click<span>Cabs</span></span>
  </a>
  <a href="https://clickcabs.in/" class="nav-link"><i class="fas fa-arrow-left" style="margin-right:5px;"></i>Back to site</a>
</nav>

<div class="main">
  <div class="card">
    <div class="card-header">
      <img src="https://clickcabs.in/images/logo.jpg" alt="Click Cabs"/>
      <h1>Create Your Account</h1>
      <p>Book cabs across India — fast, safe, and reliable</p>
    </div>
    <div class="card-body">
      <div class="error-msg" id="errorMsg"><i class="fas fa-exclamation-circle"></i><span id="errorText"></span></div>
      <div class="success-msg" id="successMsg"><i class="fas fa-check-circle"></i><span>Account created! Redirecting…</span></div>

      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name <span class="req">*</span></label>
          <div class="input-wrap"><i class="fas fa-user ico"></i><input type="text" id="firstName" placeholder="Rahul" autocomplete="given-name"/></div>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name <span class="req">*</span></label>
          <div class="input-wrap"><i class="fas fa-user ico"></i><input type="text" id="lastName" placeholder="Sharma" autocomplete="family-name"/></div>
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Mobile Number <span class="req">*</span></label>
        <div class="input-wrap"><i class="fas fa-phone ico"></i><input type="tel" id="phone" placeholder="+91 98765 43210" autocomplete="tel"/></div>
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="req">*</span></label>
        <div class="input-wrap"><i class="fas fa-envelope ico"></i><input type="email" id="email" placeholder="you@gmail.com" autocomplete="email"/></div>
      </div>

      <div class="form-group">
        <label for="password">Password <span class="req">*</span></label>
        <div class="input-wrap"><i class="fas fa-lock ico"></i><input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password"/></div>
      </div>

      <div class="form-group">
        <label for="confirmPw">Confirm Password <span class="req">*</span></label>
        <div class="input-wrap"><i class="fas fa-lock ico"></i><input type="password" id="confirmPw" placeholder="Repeat password" autocomplete="new-password"/></div>
      </div>

      <p class="terms">By signing up you agree to Click Cabs' <a href="https://clickcabs.in/terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a> and <a href="https://clickcabs.in/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</p>

      <button class="signup-btn" id="signupBtn"><i class="fas fa-user-plus"></i> Create Account</button>

      <div class="login-prompt">Already have an account? <a href="user-login.html">Log in</a></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, deleteUser, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCoITUbvm1c0-Ud9VN_jVOZg99dg42jPgY",
    authDomain: "clickcabs-772bd.firebaseapp.com",
    projectId: "clickcabs-772bd",
    storageBucket: "clickcabs-772bd.firebasestorage.app",
    messagingSenderId: "861153834886",
    appId: "1:861153834886:web:eae295a297c47120c31e07"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const MAIN_SITE = /(^|\.)clickcabs\.in$/i.test(location.hostname) ? 'https://clickcabs.in/' : '/';

  /* Firebase's own error text ("Firebase: Error (auth/invalid-email).") is
     not meant for customers. Every code a login or sign-up can realistically
     hit gets a plain sentence; anything else still names the code. */
  function friendly(err) {
    const code = (err && err.code) || '';
    const said = {
      'auth/invalid-credential': 'Wrong email or password. Please try again.',
      'auth/wrong-password': 'Wrong email or password. Please try again.',
      'auth/user-not-found': 'Wrong email or password. Please try again.',
      'auth/invalid-email': 'That email address does not look right.',
      'auth/missing-password': 'Please enter your password.',
      'auth/user-disabled': 'This account has been switched off. Please contact Click Cabs support.',
      'auth/too-many-requests': 'Too many attempts. Please wait a few minutes and try again.',
      'auth/network-request-failed': 'Could not connect. Check your internet and try again.',
      'auth/email-already-in-use': 'This email is already registered. Please log in instead.',
      'auth/weak-password': 'That password is too weak. Use at least 8 characters.',
      'auth/operation-not-allowed': 'Sign-in is switched off right now. Please contact Click Cabs support.',
      'unavailable': 'Could not connect. Check your internet and try again.',
      'permission-denied': 'The server refused this request. Please contact Click Cabs support.'
    };
    return said[code] || ('Something went wrong' + (code ? ' (' + code + ')' : '') + '. Please try again.');
  }

  const btn = document.getElementById('signupBtn');
  const BTN_IDLE = btn.innerHTML;
  let busy = false;

  function showError(msg, fieldId) {
    document.getElementById('errorText').textContent = msg;
    const box = document.getElementById('errorMsg');
    box.style.display = 'flex';
    document.getElementById('successMsg').style.display = 'none';
    if (fieldId) {
      const f = document.getElementById(fieldId);
      f.style.borderColor = '#e03d3d';
      f.addEventListener('input', () => { f.style.borderColor = ''; }, { once: true });
      f.focus();
    }
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function idle() { busy = false; btn.innerHTML = BTN_IDLE; btn.disabled = false; }

  const emailOk = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s);
  const phoneOk = (s) => { const d = s.replace(/\D/g, ''); return d.length >= 10 && d.length <= 13; };

  async function handleSignup() {
    if (busy) return;
    const val = id => document.getElementById(id).value;
    const firstName = val('firstName').trim();
    const lastName = val('lastName').trim();
    const phone = val('phone').trim();
    const email = val('email').trim();
    const password = val('password');
    const confirmPw = val('confirmPw');
    document.getElementById('errorMsg').style.display = 'none';

    const missing = ['firstName', 'lastName', 'phone', 'email', 'password', 'confirmPw'].find(id => !val(id).trim());
    if (missing) { showError('Please fill in all fields.', missing); return; }
    if (!phoneOk(phone)) { showError('Please enter a valid 10-digit mobile number.', 'phone'); return; }
    if (!emailOk(email)) { showError('That email address does not look right.', 'email'); return; }
    if (password.length < 8) { showError('Password must be at least 8 characters.', 'password'); return; }
    if (password !== confirmPw) { showError('Passwords do not match.', 'confirmPw'); return; }

    busy = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account…';
    btn.disabled = true;

    let cred;
    try {
      cred = await createUserWithEmailAndPassword(auth, email, password);
    } catch (err) {
      idle();
      showError(friendly(err), err && err.code === 'auth/email-already-in-use' ? 'email' : null);
      return;
    }
    try {
      await setDoc(doc(db, 'users', cred.user.uid), {
        firstName, lastName, phone, email,
        createdAt: new Date().toISOString(),
        role: 'user'
      });
    } catch (err) {
      /* The login was made but the profile could not be saved. Undo the
         login, or this email would be stuck for good: "already registered"
         here and "no customer account" on the login page. */
      try { await deleteUser(cred.user); } catch (e) { console.warn('rollback failed:', e); }
      idle();
      showError('Your account could not be finished. ' + friendly(err));
      return;
    }
    document.getElementById('successMsg').style.display = 'flex';
    setTimeout(() => { window.location.href = MAIN_SITE; }, 1500);
  }

  btn.addEventListener('click', handleSignup);
  /* Enter only from a text field, and never while a sign-up is running: a
     second press used to start a second sign-up, which then reported
     "already registered" over the one that had just worked. */
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') handleSignup(); });

  try { await setPersistence(auth, browserLocalPersistence); } catch (e) { console.warn('persistence:', e); }
</script>

<script type="module">
  /* Tells the main site's header whether someone is signed in, so it can
     show "Log out". Sets a cookie, cc_auth, holding only the first letter of
     the user's name or email: never the address, never a token.
     Production: scoped to .clickcabs.in, so clickcabs.in can read a login
     made here on portal.clickcabs.in (each address's own storage is kept
     separate by the browser; a parent-domain cookie is shared by design).
     Staging: these pages are served from the main site's own address at
     /account/, so an ordinary cookie is enough.
     Reuses the Firebase app this page already started. */
  import { getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  const onProd = /(^|\.)clickcabs\.in$/i.test(location.hostname);
  const scope = '; Path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '')
              + (onProd ? '; Domain=.clickcabs.in' : '');
  const setAuthCookie = (initial) => {
    document.cookie = initial
      ? 'cc_auth=' + encodeURIComponent(initial) + scope + '; Max-Age=2592000'
      : 'cc_auth=' + scope + '; Max-Age=0';
  };
  let tries = 0;
  (function watch() {
    const app = getApps()[0];
    if (!app) { if (++tries < 25) setTimeout(watch, 200); return; }
    onAuthStateChanged(getAuth(app), (user) => {
      const s = user ? String(user.displayName || user.email || '?').trim() : '';
      setAuthCookie(user ? (s.charAt(0) || '?').toUpperCase() : '');
      try { localStorage.removeItem('cc_auth_hint'); } catch (e) {}   // the old marker, no longer read
    });
  })();

  /* Links back to the main site name clickcabs.in. On the staging copy the
     main site is this same address, so point them at its home page. */
  if (!onProd) {
    document.querySelectorAll('a[href^="https://clickcabs.in/"]').forEach(a => {
      a.setAttribute('href', '/' + a.getAttribute('href').slice('https://clickcabs.in/'.length));
    });
  }
</script>
</body>
</html>
