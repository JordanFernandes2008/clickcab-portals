<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    /* Opened at the portals' own address? Move to the same page on the main
       site's /account/ address, so this login is shared with the main site's
       header (browsers keep logins separate per address). Served through
       /account/ the hostname is the main site's, so this never loops. */
    if (location.hostname === 'clickcab-portals.vercel.app') {
      location.replace('https://clickcab-7fv3.vercel.app/account' + location.pathname + location.search + location.hash);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vendor Login – Click Cabs</title>
  <link rel="icon" type="image/png" href="https://clickcabs.in/images/favicon.png" />
  <meta name="description" content="Vendor sign-in for Click Cabs partners — manage your fleet, documents and application status." />
  <meta name="theme-color" content="#01456c" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #01456c;
      --yellow: #f5a800;
      --light-bg: #f4f7fa;
      --border: #dde3ea;
      --text: #1a2b3c;
      --muted: #6b7c8d;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--light-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAVBAR ── */
    nav {
      background: var(--blue);
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 65px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      flex-shrink: 0;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-logo img {
      height: 42px;
      width: 42px;
      object-fit: contain;
      border-radius: 6px;
      background: #fff;
      padding: 3px;
    }

    .nav-logo-text {
      color: #fff;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .nav-logo-text span { color: var(--yellow); }

    .nav-signup-btn {
      background: var(--yellow);
      color: var(--blue);
      font-weight: 700;
      padding: 8px 22px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }

    .nav-signup-btn:hover { opacity: 0.88; }

    /* ── MAIN CENTERED ── */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    /* ── CARD ── */
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 32px rgba(1,69,108,0.12);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }

    /* ── CARD HEADER ── */
    .card-header {
      background: linear-gradient(135deg, var(--blue) 60%, #025a8e 100%);
      padding: 36px 32px 28px;
      text-align: center;
      color: #fff;
    }

    .card-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
      padding: 8px;
      margin: 0 auto 16px;
      display: block;
      box-shadow: 0 4px 16px rgba(0,0,0,0.20);
    }

    .card-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .card-header p {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.78);
    }

    /* ── CARD BODY ── */
    .card-body {
      padding: 32px 32px 28px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px 11px 38px;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(1,69,108,0.10);
    }

    .forgot {
      text-align: right;
      margin-top: -12px;
      margin-bottom: 24px;
    }

    .forgot a, .forgot .cc-forgot {
      font-size: 0.82rem;
      color: var(--blue);
      text-decoration: none;
    }

    .forgot a:hover, .forgot .cc-forgot:hover { text-decoration: underline; }

    /* ── LOGIN BTN ── */
    .login-btn {
      width: 100%;
      background: var(--yellow);
      color: var(--blue);
      font-weight: 800;
      font-size: 1.05rem;
      padding: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.3px;
    }

    .login-btn:hover {
      background: #e09900;
      transform: translateY(-1px);
    }

    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── SIGNUP LINK ── */
    .signup-prompt {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .signup-prompt a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }

    .signup-prompt a:hover { text-decoration: underline; }

    /* ── BACK TO SITE ── */
    .back-link {
      text-align: center;
      padding: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      background: #fafcff;
    }

    .back-link a {
      color: var(--muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-link a:hover { color: var(--blue); }

    /* ── ERROR MSG ── */
    .error-msg {
      display: none;
      background: #fff0f0;
      border: 1px solid #f5c6c6;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      color: #c0392b;
      margin-bottom: 18px;
      align-items: center;
      gap: 8px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .card-body { padding: 24px 20px 20px; }
      .card-header { padding: 28px 20px 22px; }
      nav { padding: 0 18px; }
    }
  
    /* "Forgot password?" is a button now, styled exactly like the link it replaced */
    .cc-forgot { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
    .cc-forgot:focus-visible { outline: 2px solid #f5a800; outline-offset: 2px; border-radius: 3px; }
    .cc-forgot:disabled { opacity: 0.6; cursor: wait; }
    .cc-reset-msg { display: none; border-radius: 8px; padding: 10px 14px; font-size: 0.83rem; line-height: 1.5; margin: 0 0 16px; }
    .cc-reset-msg.show { display: block; }
    .cc-reset-msg.ok   { background: #eaf7ef; border: 1px solid #bfe5cc; color: #1a6e41; }
    .cc-reset-msg.err  { background: #fff0f0; border: 1px solid #f5c6c6; color: #c0392b; }
    .cc-reset-msg.info { background: #eef4f9; border: 1px solid #cfe0ee; color: #01456c; }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav>
  <a href="index.html" class="nav-logo">
    <img src="https://clickcabs.in/images/logo.jpg" alt="Click Cabs Logo" />
    <span class="nav-logo-text">Click<span>Cabs</span></span>
  </a>
  <a href="vendor-signup.html" class="nav-signup-btn">Sign Up</a>
</nav>

<!-- MAIN -->
<div class="main">
  <div class="login-card">

    <!-- HEADER -->
    <div class="card-header">
      <img src="https://clickcabs.in/images/logo.jpg" alt="Click Cabs" class="card-logo" />
      <h1>Vendor Portal</h1>
      <p>Log in to manage your Click Cabs fleet</p>
    </div>

    <!-- BODY -->
    <div class="card-body">

      <!-- Error message (shown on wrong credentials) -->
      <div class="error-msg" id="errorMsg">
        <i class="fas fa-exclamation-circle"></i>
        <span>Invalid email or password. Please try again.</span>
      </div>

      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" id="loginEmail" placeholder="you@company.com" autocomplete="email" required />
        </div>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required />
        </div>
      </div>

      <div class="forgot">
        <button type="button" class="cc-forgot">Forgot password?</button>
      </div>

      <button class="login-btn" id="loginBtn">
        <i class="fas fa-sign-in-alt" style="margin-right:8px;"></i>
        Log In
      </button>

      <div class="divider">or</div>

      <p class="signup-prompt">
        New vendor? <a href="vendor-signup.html">Create an account</a>
      </p>

    </div>

    <!-- BACK LINK -->
    <div class="back-link">
      <a href="https://clickcabs.in/">
        <i class="fas fa-arrow-left"></i> Back to Click Cabs website
      </a>
    </div>

  </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCoITUbvm1c0-Ud9VN_jVOZg99dg42jPgY",
    authDomain: "clickcabs-772bd.firebaseapp.com",
    projectId: "clickcabs-772bd",
    storageBucket: "clickcabs-772bd.firebasestorage.app",
    messagingSenderId: "861153834886",
    appId: "1:861153834886:web:eae295a297c47120c31e07",
    measurementId: "G-0Z06RPDWJR"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  /* Firebase's own error text ("Firebase: Error (auth/invalid-email).") is
     not meant for customers. Every code a login or sign-up can realistically
     hit gets a plain sentence; anything else still names the code. */
  function friendly(err) {
    const code = (err && err.code) || '';
    const said = {
      'auth/invalid-credential': 'Wrong email or password. Please try again.',
      'auth/wrong-password': 'Wrong email or password. Please try again.',
      'auth/user-not-found': 'Wrong email or password. Please try again.',
      'auth/invalid-email': 'That email address does not look right.',
      'auth/missing-password': 'Please enter your password.',
      'auth/user-disabled': 'This account has been switched off. Please contact Click Cabs support.',
      'auth/too-many-requests': 'Too many attempts. Please wait a few minutes and try again.',
      'auth/network-request-failed': 'Could not connect. Check your internet and try again.',
      'auth/email-already-in-use': 'This email is already registered. Please log in instead.',
      'auth/weak-password': 'That password is too weak. Use at least 8 characters.',
      'auth/operation-not-allowed': 'Sign-in is switched off right now. Please contact Click Cabs support.',
      'unavailable': 'Could not connect. Check your internet and try again.',
      'permission-denied': 'The server refused this request. Please contact Click Cabs support.'
    };
    return said[code] || ('Something went wrong' + (code ? ' (' + code + ')' : '') + '. Please try again.');
  }

  const btn = document.getElementById('loginBtn');
  const BTN_IDLE = btn.innerHTML;
  const errorMsg = document.getElementById('errorMsg');
  let busy = false;

  function showError(msg, link) {
    const text = errorMsg.querySelector('span');
    text.textContent = msg;
    if (link) {
      const a = document.createElement('a');
      a.href = link.href;
      a.textContent = link.text;
      a.style.cssText = 'color:inherit;font-weight:700;';
      text.append(' ', a);
    }
    errorMsg.style.display = 'flex';
  }
  function idle() { busy = false; btn.innerHTML = BTN_IDLE; btn.disabled = false; }

  // Sent back here by the dashboard because the account is not a partner
  if (new URLSearchParams(location.search).get('reason') === 'not-partner') {
    showError('That account is not registered as a Cab Partner.', { href: 'user-login.html', text: 'Customer login' });
  }

  async function handleLogin() {
    if (busy) return;
    const email = document.getElementById('loginEmail').value.trim();
    // Not trimmed: sign-up never trimmed it, so a password ending in a
    // space could never log in here.
    const password = document.getElementById('loginPassword').value;
    errorMsg.style.display = 'none';
    if (!email || !password) { showError('Please enter both email and password.'); return; }
    busy = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Logging in…';
    btn.disabled = true;

    let cred;
    try {
      cred = await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      idle(); showError(friendly(err)); return;
    }

    /* Only partners have a document in /vendors. Anyone else used to be
       let through, then bounced by the dashboard straight back to this
       page with no explanation. */
    try {
      if ((await getDoc(doc(db, 'vendors', cred.user.uid))).exists()) {
        window.location.href = 'vendor-dashboard.html';
        return;
      }
      const customer = await getDoc(doc(db, 'users', cred.user.uid)).then(snap => snap.exists(), () => false);
      await signOut(auth);
      idle();
      if (customer) showError('This is a customer account.', { href: 'user-login.html', text: 'Go to Customer login' });
      else showError('No partner application was found for this email.', { href: 'vendor-signup.html', text: 'Apply as a partner' });
    } catch (err) {
      try { await signOut(auth); } catch (e) {}
      idle(); showError(friendly(err));
    }
  }

  btn.addEventListener('click', handleLogin);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') handleLogin();
  });
</script>


<script type="module">
  /* "Forgot password?" used to be href="#" and did nothing, so anyone who
     forgot their password was simply locked out. Firebase sends the reset
     email itself: free, and no backend needed.

     The success message is worded the same whether or not the address has
     an account, so this form cannot be used to find out who is registered.

     This module reuses the Firebase app the page has already started, so it
     works the same on the customer, partner and admin login pages. */
  import { getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const btn = document.querySelector('.cc-forgot');
  const emailEl = document.getElementById('loginEmail');
  if (btn && emailEl) {
    const box = document.createElement('div');
    box.className = 'cc-reset-msg';
    box.setAttribute('role', 'status');
    box.setAttribute('aria-live', 'polite');
    btn.parentElement.insertAdjacentElement('afterend', box);

    const say = (kind, text) => { box.className = 'cc-reset-msg show ' + kind; box.textContent = text; };
    const sent = (email) => say('ok', 'If ' + email + ' has an account, a reset link is on its way. Check your inbox and spam folder.');

    btn.addEventListener('click', async () => {
      const email = emailEl.value.trim();
      if (!email) {
        say('err', 'Type your email address above, then tap "Forgot password?" again.');
        emailEl.focus();
        return;
      }
      const app = getApps()[0];
      if (!app) { say('err', 'Still loading. Please try again in a moment.'); return; }

      btn.disabled = true;
      say('info', 'Sending a reset link\u2026');
      try {
        await sendPasswordResetEmail(getAuth(app), email);
        sent(email);
      } catch (err) {
        const code = (err && err.code) || '';
        if (code === 'auth/user-not-found') sent(email);
        else if (code === 'auth/invalid-email') say('err', 'That email address does not look right.');
        else if (code === 'auth/too-many-requests') say('err', 'Too many attempts. Please wait a few minutes and try again.');
        else if (code === 'auth/network-request-failed') say('err', 'Could not reach the server. Check your connection and try again.');
        else say('err', 'Could not send the reset email (' + (code || 'unknown error') + ').');
      } finally {
        btn.disabled = false;
      }
    });
  }
</script>

<script type="module">
  /* Tells the main site's header whether someone is signed in, so it can
     show "Log out". Sets a cookie, cc_auth, holding only the first letter of
     the user's name or email: never the address, never a token.
     Production: scoped to .clickcabs.in, so clickcabs.in can read a login
     made here on portal.clickcabs.in (each address's own storage is kept
     separate by the browser; a parent-domain cookie is shared by design).
     Staging: these pages are served from the main site's own address at
     /account/, so an ordinary cookie is enough.
     Reuses the Firebase app this page already started. */
  import { getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  const onProd = /(^|\.)clickcabs\.in$/i.test(location.hostname);
  const scope = '; Path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '')
              + (onProd ? '; Domain=.clickcabs.in' : '');
  const setAuthCookie = (initial) => {
    document.cookie = initial
      ? 'cc_auth=' + encodeURIComponent(initial) + scope + '; Max-Age=2592000'
      : 'cc_auth=' + scope + '; Max-Age=0';
  };
  let tries = 0;
  (function watch() {
    const app = getApps()[0];
    if (!app) { if (++tries < 25) setTimeout(watch, 200); return; }
    onAuthStateChanged(getAuth(app), (user) => {
      const s = user ? String(user.displayName || user.email || '?').trim() : '';
      setAuthCookie(user ? (s.charAt(0) || '?').toUpperCase() : '');
      try { localStorage.removeItem('cc_auth_hint'); } catch (e) {}   // the old marker, no longer read
    });
  })();

  /* Links back to the main site name clickcabs.in. On the staging copy the
     main site is this same address, so point them at its home page. */
  if (!onProd) {
    document.querySelectorAll('a[href^="https://clickcabs.in/"]').forEach(a => {
      a.setAttribute('href', '/' + a.getAttribute('href').slice('https://clickcabs.in/'.length));
    });
  }
</script>
